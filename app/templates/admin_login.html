{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
  <div class="auth-card">
    <div class="auth-card-header">
      <h2>Admin Access</h2>
      <p>MedPredict system administrator</p>
    </div>

    <form action="/admin/login" method="POST" class="auth-form">
      <div class="field-group">
        <label class="field-label">Admin Password</label>
        <div class="input-wrap">
          <input type="password" name="password" class="field-input"
                 placeholder="Enter admin password" required />
          <button type="button" class="input-eye" onclick="togglePassword('password', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full">Enter Admin Panel</button>
    </form>

    <div style="margin-top: 16px; text-align: center;">
      <a href="/" style="font-size: 13px; color: var(--clr-text-3);">← Back to main site</a>
    </div>

    <div class="info-note" style="margin-top: 20px;">
      <span class="info-icon">ℹ</span>
      <span style="font-size: 12px;">Default password: <code>admin123</code>. 
        Set <code>ADMIN_PASSWORD</code> in your .env file for production.</span>
    </div>
  </div>
</div>
{% endblock %}
